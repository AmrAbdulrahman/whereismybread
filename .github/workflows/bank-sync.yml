name: Bank sync

# Manual fallback for the periodic bank sync. The recurring schedule is owned by
# a QStash cron (every 5 min) that POSTs the endpoint with a signed request —
# see scripts/qstash-schedule.mjs. This workflow stays as a break-glass manual
# trigger and hits the GET path, which is protected by the shared CRON_SECRET
# (see apps/web/src/app/api/bank-sync/enable-banking/route.ts).
#
# Required on the `production` environment:
#   - secret  CRON_SECRET  — identical to the Vercel env var of the same name
#   - var     APP_URL      — canonical production origin, https, no trailing
#                            slash (e.g. https://www.whereismybread.com)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bank-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Trigger bank sync
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL var and CRON_SECRET secret must be set on the production environment"
            exit 1
          fi

          # --location-trusted keeps the auth header across a redirect; set
          # APP_URL to the canonical host so there is no redirect anyway.
          code=$(curl --silent --show-error --location-trusted \
            --output /tmp/body.txt --write-out '%{http_code}' \
            --max-time 330 --retry 2 --retry-delay 10 --retry-all-errors \
            --request GET \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/bank-sync/enable-banking")

          if [ "${code#2}" = "$code" ]; then
            echo "::error::Bank sync failed with HTTP $code"
            cat /tmp/body.txt || true
            exit 1
          fi
          echo "Bank sync OK (HTTP $code)"
