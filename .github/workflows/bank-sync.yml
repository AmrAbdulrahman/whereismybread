name: Bank sync

# Replaces the former Vercel Cron entry in vercel.json. Hits the production
# bank-sync endpoint every 15 minutes. The endpoint is protected by a shared
# secret: it only runs when the request carries `Authorization: Bearer
# <CRON_SECRET>` (see apps/web/src/app/api/bank-sync/enable-banking/route.ts).
#
# Required config on the `production` environment:
#   - secret  CRON_SECRET  — must match the Vercel env var of the same name
#   - var     APP_URL      — production base URL, e.g. https://app.example.com
#                            (no trailing slash)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bank-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Trigger bank sync
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL var and CRON_SECRET secret must be set on the production environment"
            exit 1
          fi
          case "$APP_URL" in
            https://localhost*|http://localhost*|https://127.*|http://127.*)
              echo "::error::APP_URL is localhost; set the production environment variable to the live site, e.g. https://www.whereismybread.com"
              exit 1
              ;;
            https://*) ;;
            *)
              echo "::error::APP_URL must be https with no trailing slash (got: $APP_URL)"
              exit 1
              ;;
          esac
          url="${APP_URL%/}/api/bank-sync/enable-banking"
          echo "POST $url"
          set +e
          code=$(curl --silent --show-error --location \
            --output /tmp/body.txt --write-out '%{http_code}' \
            --max-time 330 --retry 2 --retry-delay 10 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "$url" 2>/tmp/curl.err)
          curl_exit=$?
          set -e
          if [ "$curl_exit" -ne 0 ]; then
            echo "::error::curl failed with exit $curl_exit (35 = TLS handshake failed — check APP_URL is the production https origin)"
            cat /tmp/curl.err || true
            exit "$curl_exit"
          fi
          echo "HTTP $code"
          cat /tmp/body.txt || true
          echo
          case "$code" in
            2*) echo "Bank sync OK" ;;
            *)  echo "::error::Bank sync failed with HTTP $code"; exit 1 ;;
          esac
